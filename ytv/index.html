<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Player</title>
  <style>
    body, video { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; border: none; }
  </style>
</head>
<body>
  <video id="player" controls autoplay></video>
  <script>
    const params = new URLSearchParams(window.location.search);
    const v = params.get('v');
    
    if (v) {
      // Correctly constructing the URL with the ?url= parameter
      const videoUrl = encodeURIComponent("https://www.youtube.com/watch?v=" + v);
      const endpoint = `https://youtube-to-mp4.p.rapidapi.com/url=&title?url=${videoUrl}&title=Video`;

      fetch(endpoint, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'x-rapidapi-host': 'youtube-to-mp4.p.rapidapi.com',
          'x-rapidapi-key': '6f57597f3cmshc6813e3bdace6b2p1d7949jsn3bccc98dc185'
        }
      })
      .then(response => response.json())
      .then(data => {
        // Accessing the URL provided by your RapidAPI response
        if (data && data.url) {
          document.getElementById('player').src = data.url;
        } else {
          console.error('API response did not contain a URL:', data);
        }
      })
      .catch(err => {
        console.error('API request failed:', err);
      });
    }
  </script>
</body>
</html>
