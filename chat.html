<div class="view-head">
  <p class="eyebrow">Live</p>
  <h1>Chat Room</h1>
  <p class="sub">Talk with everyone currently on the site. This is currently in beta and can/will be desynced.</p>
  <p class="sub">To send images you have to be level 5, level 8 for sounds, level 10 for anything files. You gain a level each 12 messages you send.</p>
</div>

<style>
  .chat-panel-head{justify-content:space-between;}
  .chat-panel-head .head-left{display:flex; align-items:center; gap:8px;}
  .level-badge{
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--accent-2);
    border:1px solid var(--border); background:var(--bg-base); padding:3px 9px; border-radius:20px;
    letter-spacing:0.03em;
  }
  .msg{position:relative;}
  .msg-footer{display:flex; align-items:center; gap:6px; margin-top:2px; flex-wrap:wrap;}
  .reaction-pill{
    display:flex; align-items:center; gap:5px; background:var(--bg-base); border:1px solid var(--border);
    border-radius:12px; padding:2px 8px; font-size:0.8rem; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .reaction-pill:hover{border-color:var(--accent-2);}
  .reaction-pill.active{border-color:var(--accent-2); background:rgba(53,227,200,0.14);}
  .reaction-pill .count{font-family:'JetBrains Mono',monospace; color:var(--text-muted); font-size:0.72rem;}
  .react-add-btn{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--border); background:var(--bg-base);
    color:var(--text-muted); cursor:pointer; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;
    transition:border-color .15s, color .15s;
  }
  .react-add-btn:hover{border-color:var(--accent); color:var(--accent);}
  .emoji-picker{
    position:fixed; z-index:100; background:var(--bg-panel-hi); border:1px solid var(--border);
    border-radius:10px; padding:6px; display:flex; flex-wrap:wrap; gap:3px; max-width:220px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .emoji-picker button{
    background:transparent; border:none; font-size:18px; cursor:pointer; padding:5px; border-radius:6px;
    line-height:1;
  }
  .emoji-picker button:hover{background:var(--bg-base);}
</style>

<div class="chat-panel">
  <div class="chat-panel-head">
    <div class="head-left"><span class="dot"></span>Chat</div>
    <span class="level-badge" id="levelBadge">Lv. 1</span>
  </div>
  <div class="chat-messages" id="messages"></div>
</div>

<div class="bottom-bar hidden" id="bottomBar">
  <div class="bottom-bar-inner">
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="chat-input">
      <button class="attach-btn" id="attachBtn" title="Attach a file">+</button>
      <input type="file" id="fileInput" class="hidden" accept="image/*,video/*,audio/*,.pdf,.txt,.zip,.doc,.docx">
      <input type="text" id="msgInput" placeholder="Type a message..." maxlength="200">
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<div class="name-screen" id="nameScreen">
  <p class="eyebrow">Chat Room</p>
  <h1>Enter a name to chat</h1>
  <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
  <button class="btn" id="nameBtn">Continue</button>
</div>

<script type="module">
  import leoProfanity from 'https://cdn.jsdelivr.net/npm/leo-profanity@1.7.0/+esm';

  leoProfanity.remove(['crap', 'damn', 'hell', 'suck', 'stupid', 'idiot']);
  leoProfanity.add(['yourword1', 'yourword2']); // add your custom list here

  function checkMessage(text) {
    if (leoProfanity.check(text)) {
      return { allowed: false, censored: leoProfanity.clean(text) };
    }
    return { allowed: true, censored: text };
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const nameScreen = document.getElementById('nameScreen');
  const bottomBar = document.getElementById('bottomBar');
  const nameInput = document.getElementById('nameInput');
  const nameBtn = document.getElementById('nameBtn');
  const levelBadgeEl = document.getElementById('levelBadge');

  let username = '';
  let ws = null;

  const MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB, keep WebSocket messages reasonable

  // ---------- Reactions ----------
  const REACTION_EMOJIS = ['😀', '😅', '🤣', '😉', '🥰', '😝', '😱', '😡', '😨', '🤮', '😮', '😎'];
  const messageElements = new Map();      // messageId -> { footerEl, reactionsEl }
  const reactionsState = new Map();       // messageId -> Map(emoji -> Set(names))
  let activeEmojiPicker = null;

  function genId() {
    return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function closeEmojiPicker() {
    if (activeEmojiPicker) {
      activeEmojiPicker.remove();
      activeEmojiPicker = null;
    }
  }
  document.addEventListener('click', (e) => {
    if (activeEmojiPicker && !activeEmojiPicker.contains(e.target) && !e.target.closest('.react-add-btn')) {
      closeEmojiPicker();
    }
  });

  function openEmojiPicker(anchorBtn, messageId) {
    if (activeEmojiPicker) {
      closeEmojiPicker();
      return;
    }
    const picker = document.createElement('div');
    picker.className = 'emoji-picker';
    REACTION_EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = emoji;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleReaction(messageId, emoji);
        closeEmojiPicker();
      });
      picker.appendChild(btn);
    });
    document.body.appendChild(picker);

    const rect = anchorBtn.getBoundingClientRect();
    const pickerRect = picker.getBoundingClientRect();
    let top = rect.top - pickerRect.height - 6;
    if (top < 8) top = rect.bottom + 6; // flip below if not enough room above
    let left = rect.left;
    if (left + pickerRect.width > window.innerWidth - 8) {
      left = window.innerWidth - pickerRect.width - 8;
    }
    picker.style.top = `${top}px`;
    picker.style.left = `${left}px`;

    activeEmojiPicker = picker;
  }

  function toggleReaction(messageId, emoji) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const emojiMap = reactionsState.get(messageId) || new Map();
    const users = emojiMap.get(emoji) || new Set();
    const action = users.has(username) ? 'remove' : 'add';
    ws.send(JSON.stringify({ type: 'reaction', messageId, emoji, name: username, action }));
  }

  function handleReactionEvent(data) {
    const { messageId, emoji, name, action } = data;
    if (!messageId || !emoji || !name) return;
    if (!reactionsState.has(messageId)) reactionsState.set(messageId, new Map());
    const emojiMap = reactionsState.get(messageId);
    const users = emojiMap.get(emoji) || new Set();
    if (action === 'remove') {
      users.delete(name);
    } else {
      users.add(name);
    }
    if (users.size === 0) {
      emojiMap.delete(emoji);
    } else {
      emojiMap.set(emoji, users);
    }
    renderReactions(messageId);
  }

  function renderReactions(messageId) {
    const refs = messageElements.get(messageId);
    if (!refs) return; // message not rendered (yet) on this client
    const emojiMap = reactionsState.get(messageId) || new Map();
    refs.reactionsEl.innerHTML = '';
    emojiMap.forEach((users, emoji) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'reaction-pill' + (users.has(username) ? ' active' : '');
      pill.innerHTML = `<span>${emoji}</span><span class="count">${users.size}</span>`;
      pill.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleReaction(messageId, emoji);
      });
      refs.reactionsEl.appendChild(pill);
    });
  }

  function loadHistory(historyMessages) {
    // Full resync: server is the source of truth. Clear local state and
    // rebuild from what it sends, whether this is an initial join or a
    // reconnect after a dropped connection.
    messagesEl.innerHTML = '';
    messageElements.clear();
    reactionsState.clear();
    firstMessage = false;

    historyMessages.forEach(m => {
      addMessage(m.name, m.message, m.attachment, m.id);
      if (m.reactions) {
        const emojiMap = new Map();
        Object.entries(m.reactions).forEach(([emoji, names]) => {
          emojiMap.set(emoji, new Set(names));
        });
        reactionsState.set(m.id, emojiMap);
        renderReactions(m.id);
      }
    });
  }

  // ---------- Leveling system ----------
  // Level up every LEVEL_INTERVAL messages sent. Tracked per-browser via localStorage.
  const LEVEL_INTERVAL = 12; // one level per ~10-15 messages
  const LEVEL_STORAGE_KEY = 'cgChatStats';
  const ATTACHMENT_LEVEL_REQS = { image: 5, audio: 8, video: 10, file: 10 };
  const KIND_LABELS = { image: 'images', audio: 'audio', video: 'videos', file: 'other files' };

  function loadStats() {
    try {
      const raw = localStorage.getItem(LEVEL_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (typeof parsed.messagesSent === 'number') return parsed;
      }
    } catch (e) {}
    return { messagesSent: 0 };
  }

  function saveStats() {
    try {
      localStorage.setItem(LEVEL_STORAGE_KEY, JSON.stringify(stats));
    } catch (e) {}
  }

  function computeLevel(messagesSent) {
    return Math.floor(messagesSent / LEVEL_INTERVAL) + 1;
  }

  function messagesUntilLevel(targetLevel) {
    const needed = (targetLevel - 1) * LEVEL_INTERVAL - stats.messagesSent;
    return needed > 0 ? needed : 0;
  }

  let stats = loadStats();
  stats.level = computeLevel(stats.messagesSent);

  function updateLevelBadge() {
    levelBadgeEl.textContent = `Lv. ${stats.level}`;
  }

  const LEVEL_PERMISSION_LABELS = { 5: 'images', 8: 'sounds', 10: 'files' };

  function recordMessageSent() {
    const oldLevel = stats.level;
    stats.messagesSent++;
    stats.level = computeLevel(stats.messagesSent);
    saveStats();
    updateLevelBadge();

    for (let lvl = oldLevel + 1; lvl <= stats.level; lvl++) {
      const perm = LEVEL_PERMISSION_LABELS[lvl];
      if (perm) {
        addSystemMessage(`You've reached level ${lvl}, this earns you permission to send ${perm}.`);
      } else {
        addSystemMessage(`You've reached level ${lvl}!`);
      }
    }
  }

  function attachmentAllowed(kind) {
    const req = ATTACHMENT_LEVEL_REQS[kind] ?? 15;
    return stats.level >= req;
  }

  updateLevelBadge();

  function enterChat() {
    const name = nameInput.value.trim();
    if (!name) return;
    username = checkMessage(name).allowed ? name : 'Guest';
    nameScreen.classList.add('hidden');
    bottomBar.classList.remove('hidden');
    inputEl.focus();
    connectWebSocket();
  }

  nameBtn.addEventListener('click', enterChat);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterChat();
  });

  let reconnectAttempts = 0;
  const MAX_RECONNECT_ATTEMPTS = 3;
  const RECONNECT_DELAY_MS = 3000;
  let repeat = false;
  let firstMessage = false;
  function connectWebSocket() {
    ws = new WebSocket('wss://chatworker.poopoo739738494.workers.dev');

    ws.addEventListener('open', () => {
      if (reconnectAttempts > 0) {
        addSystemMessage('Reconnected.');
        repeat = false;
      } else {
        addSystemMessage('Connected to chat.');
      }
      reconnectAttempts = 0;
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') {
        loadHistory(data.messages || []);
        return;
      }
      if (data.type === 'reaction') {
        handleReactionEvent(data);
        return;
      }
      if (data.typing !== undefined) {
        handleTypingEvent(data);
        return;
      }
      addMessage(data.name, data.message, data.attachment, data.id);
    });

    ws.addEventListener('close', () => {
      if (repeat) return;
      addSystemMessage('Disconnected, attempting to reconnect...')
      attemptReconnect();
    });

    ws.addEventListener('error', () => {
      if (repeat) return;
      addSystemMessage('Connection error.');
    });
  }

  function attemptReconnect() {
    if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
      addSystemMessage('Failed to reconnect, please refresh.');
      return;
    }
    reconnectAttempts++;
    addSystemMessage(`(${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
    repeat = true;
    setTimeout(() => {
      connectWebSocket();
    }, RECONNECT_DELAY_MS);
  }

  function scrollToBottom() {
    const bar = document.querySelector('.bottom-bar');
    const barHeight = bar ? bar.offsetHeight : 0;
    const lastMsg = messagesEl.lastElementChild;
    if (!lastMsg) return;
    const rect = lastMsg.getBoundingClientRect();
    const desiredBottom = window.innerHeight - barHeight;
    const delta = rect.bottom - desiredBottom;
    window.scrollBy(0, delta);
  }

  // --- Typing indicator ---
  const typingIndicatorEl = document.getElementById('typingIndicator');
  const typingUsers = new Map(); // name -> timeout id (auto-clears if no update)

  function handleTypingEvent(data) {
    if (data.name === username) return; // never show yourself
    if (typingUsers.has(data.name)) {
      clearTimeout(typingUsers.get(data.name));
    }
    if (data.typing) {
      const timeoutId = setTimeout(() => {
        typingUsers.delete(data.name);
        renderTypingIndicator();
      }, 4000); // auto-clear if no follow-up event arrives
      typingUsers.set(data.name, timeoutId);
    } else {
      typingUsers.delete(data.name);
    }
    renderTypingIndicator();
  }

  function renderTypingIndicator() {
    const names = [...typingUsers.keys()];
    if (names.length === 0) {
      typingIndicatorEl.textContent = '';
    } else if (names.length === 1) {
      typingIndicatorEl.textContent = `${names[0]} is typing...`;
    } else if (names.length === 2) {
      typingIndicatorEl.textContent = `${names[0]}, ${names[1]} are typing...`;
    } else {
      typingIndicatorEl.textContent = `${names.slice(0, 2).join(', ')}, and ${names.length - 2} others are typing...`;
    }
  }

  let isTyping = false;
  let typingStopTimer = null;

  function sendTyping(typing) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ name: username, typing }));
  }

  inputEl.addEventListener('input', () => {
    if (inputEl.value.trim()) {
      if (!isTyping) {
        isTyping = true;
        sendTyping(true);
      }
      clearTimeout(typingStopTimer);
      typingStopTimer = setTimeout(() => {
        isTyping = false;
        sendTyping(false);
      }, 2000);
    } else if (isTyping) {
      isTyping = false;
      clearTimeout(typingStopTimer);
      sendTyping(false);
    }
  });

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function resolveColor(spec) {
    if (spec[0] === '#') {
      return /^#[0-9a-fA-F]{3,8}$/.test(spec) ? spec : null;
    }
    return spec.toLowerCase();
  }

  function formatMessage(rawText) {
    let text = escapeHtml(rawText);

    // Pull out code blocks/inline code first so formatting inside them isn't touched
    const codePlaceholders = [];
    text = text.replace(/```([\s\S]*?)```/g, (match, code) => {
      const token = `§§CB${codePlaceholders.length}§§`;
      codePlaceholders.push(`<pre class="code-block"><code>${code}</code></pre>`);
      return token;
    });
    text = text.replace(/`([^`\n]+?)`/g, (match, code) => {
      const token = `§§CB${codePlaceholders.length}§§`;
      codePlaceholders.push(`<code class="inline-code">${code}</code>`);
      return token;
    });

    // Bold+italic, bold, italic, strikethrough
    text = text.replace(/\*\*\*([^\*\n]+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    text = text.replace(/\*\*([^\*\n]+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^\*\n]+?)\*/g, '<em>$1</em>');
    text = text.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');

    // Color syntax: colorSpec[text], e.g. r[hello] or #00ff00[hello]
    text = text.replace(/(#[0-9a-fA-F]{3,8}|[a-zA-Z]{1,25})\[([^\[\]]+?)\]/g, (match, spec, content) => {
      const color = resolveColor(spec);
      return color ? `<span style="color:${color}">${content}</span>` : match;
    });

    // Restore code blocks/inline code
    text = text.replace(/§§CB(\d+)§§/g, (match, i) => codePlaceholders[Number(i)]);

    return text;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg blocked';
    div.textContent = text;
    messagesEl.appendChild(div);
    if (!firstMessage) {
      scrollToBottom();
      firstMessage = true;
    }
  }

  function attachmentKind(mimeType) {
    if (mimeType.startsWith('image/')) return 'image';
    if (mimeType.startsWith('video/')) return 'video';
    if (mimeType.startsWith('audio/')) return 'audio';
    return 'file';
  }

  function addMessage(name, text, attachment, messageId) {
    const id = messageId || genId();
    const div = document.createElement('div');
    div.className = 'msg';
    div.dataset.messageId = id;

    if (text) {
      const textLine = document.createElement('div');
      textLine.className = 'msg-text';
      const sender = document.createElement('span');
      sender.className = 'sender';
      sender.textContent = name + ':';
      textLine.appendChild(sender);
      const bodySpan = document.createElement('span');
      bodySpan.innerHTML = formatMessage(text);
      textLine.appendChild(bodySpan);
      div.appendChild(textLine);
    } else {
      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = name;
      div.appendChild(sender);
    }

    if (attachment) {
      div.appendChild(buildAttachmentEl(attachment));
    }

    const footer = document.createElement('div');
    footer.className = 'msg-footer';

    const reactionsEl = document.createElement('div');
    reactionsEl.className = 'msg-reactions';
    reactionsEl.style.display = 'contents';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'react-add-btn';
    addBtn.title = 'Add reaction';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openEmojiPicker(addBtn, id);
    });

    footer.appendChild(reactionsEl);
    footer.appendChild(addBtn);
    div.appendChild(footer);

    messageElements.set(id, { footerEl: footer, reactionsEl });
    if (!reactionsState.has(id)) reactionsState.set(id, new Map());

    messagesEl.appendChild(div);
    renderReactions(id);
    scrollToBottom();
  }

  function buildAudioPlayer(dataUrl, filename) {
    const wrap = document.createElement('div');
    wrap.className = 'audio-attachment';

    const nameEl = document.createElement('div');
    nameEl.className = 'audio-name';
    nameEl.textContent = filename || 'audio';
    wrap.appendChild(nameEl);

    const controls = document.createElement('div');
    controls.className = 'audio-controls';

    const playBtn = document.createElement('button');
    playBtn.className = 'audio-play-btn';
    playBtn.type = 'button';
    playBtn.textContent = '▶';

    const progressWrap = document.createElement('div');
    progressWrap.className = 'audio-progress-wrap';
    const track = document.createElement('div');
    track.className = 'audio-progress-track';
    const fill = document.createElement('div');
    fill.className = 'audio-progress-fill';
    const handle = document.createElement('div');
    handle.className = 'audio-progress-handle';
    track.appendChild(fill);
    track.appendChild(handle);
    progressWrap.appendChild(track);

    const timeEl = document.createElement('span');
    timeEl.className = 'audio-time';
    timeEl.textContent = '0:00 / 0:00';

    controls.appendChild(playBtn);
    controls.appendChild(progressWrap);
    controls.appendChild(timeEl);
    wrap.appendChild(controls);

    const audio = new Audio(dataUrl);
    audio.preload = 'metadata';

    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateProgress() {
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      fill.style.width = pct + '%';
      handle.style.left = pct + '%';
      timeEl.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    }

    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '❙ ❙';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    let dragging = false;

    function seekFromEvent(e) {
      const rect = track.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
        updateProgress();
      }
    }

    progressWrap.addEventListener('pointerdown', (e) => {
      dragging = true;
      seekFromEvent(e);
    });
    window.addEventListener('pointermove', (e) => {
      if (dragging) seekFromEvent(e);
    });
    window.addEventListener('pointerup', () => {
      dragging = false;
    });

    return wrap;
  }

  function buildAttachmentEl(attachment) {
    const { kind, dataUrl, filename } = attachment;

    if (kind === 'image') {
      const img = document.createElement('img');
      img.className = 'attachment';
      img.src = dataUrl;
      img.alt = filename || 'image';
      return img;
    }

    if (kind === 'video') {
      const video = document.createElement('video');
      video.className = 'attachment';
      video.src = dataUrl;
      video.controls = true;
      return video;
    }

    if (kind === 'audio') {
      return buildAudioPlayer(dataUrl, filename);
    }

    // generic file
    const wrap = document.createElement('div');
    wrap.className = 'file-attachment';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'file-name';
    nameSpan.textContent = filename || 'file';
    wrap.appendChild(nameSpan);

    const downloadLink = document.createElement('a');
    downloadLink.className = 'download-btn';
    downloadLink.href = dataUrl;
    downloadLink.download = filename || 'download';
    downloadLink.textContent = 'Download';
    wrap.appendChild(downloadLink);

    return wrap;
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (isTyping) {
      isTyping = false;
      clearTimeout(typingStopTimer);
      sendTyping(false);
    }
    ws.send(JSON.stringify({ name: username, message: text, id: genId() }));
    inputEl.value = '';
    recordMessageSent();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = ''; // reset so picking the same file again still fires 'change'
    if (!file) return;

    const kind = attachmentKind(file.type);

    if (!attachmentAllowed(kind)) {
      const req = ATTACHMENT_LEVEL_REQS[kind] ?? 10;
      const remaining = messagesUntilLevel(req);
      addSystemMessage(
        `You need level ${req} to send ${KIND_LABELS[kind]} (you're level ${stats.level}). ` +
        `Send ${remaining} more message${remaining === 1 ? '' : 's'} to unlock it.`
      );
      return;
    }

    if (file.size > MAX_FILE_BYTES) {
      addSystemMessage(`"${file.name}" is too large to send (max 5MB).`);
      return;
    }

    if (!ws || ws.readyState !== WebSocket.OPEN) {
      addSystemMessage('Not connected — cannot send file.');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const attachment = {
        kind,
        dataUrl: reader.result,
        filename: file.name
      };
      const caption = inputEl.value.trim();
      ws.send(JSON.stringify({ name: username, message: caption, attachment, id: genId() }));
      inputEl.value = '';
      recordMessageSent();
    };
    reader.onerror = () => {
      addSystemMessage(`Could not read "${file.name}".`);
    };
    reader.readAsDataURL(file);
  });
</script>
