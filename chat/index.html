<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Chat</title>
<style>
  html, body {
    min-height: 100%;
  }
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e2e;
    color: #eee;
    margin: 0;
  }
  .chat-box {
    width: 100%;
    min-height: 100vh;
    background: #2a2a3d;
    display: flex;
    flex-direction: column;
  }
  .chat-header {
    background: #3a3a55;
    padding: 12px 16px;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .chat-messages {
    flex: 1;
    padding: 12px;
    padding-bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    background: #40405c;
    padding: 6px 10px;
    border-radius: 8px;
    max-width: 80%;
    word-wrap: break-word;
    font-size: 14px;
  }
  .msg.blocked {
    background: #5c2e2e;
    color: #ffb3b3;
  }
  .chat-input {
    display: flex;
    border-top: 1px solid #3a3a55;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #2a2a3d;
    box-sizing: border-box;
  }
  .chat-input input {
    flex: 1;
    border: none;
    padding: 10px;
    background: #1e1e2e;
    color: #eee;
    outline: none;
  }
  .chat-input button {
    border: none;
    background: #5865f2;
    color: white;
    padding: 0 16px;
    cursor: pointer;
  }
  .chat-input button:hover {
    background: #4752c4;
  }
  .attach-btn {
    border: none;
    background: #3a3a55;
    color: white;
    width: 44px;
    flex-shrink: 0;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .attach-btn:hover {
    background: #4a4a6a;
  }
  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg img.attachment,
  .msg video.attachment {
    max-width: 100%;
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }
  .msg audio.attachment {
    width: 100%;
  }
  .file-attachment {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #32324a;
    padding: 8px 10px;
    border-radius: 6px;
  }
  .file-attachment .file-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }
  .file-attachment .download-btn {
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .file-attachment .download-btn:hover {
    background: #4752c4;
  }
  .name-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .name-screen h2 {
    margin: 0;
  }
  .name-screen input {
    padding: 10px 14px;
    border-radius: 6px;
    border: none;
    background: #2a2a3d;
    color: #eee;
    font-size: 16px;
    outline: none;
    width: 220px;
  }
  .name-screen button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #5865f2;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  .name-screen button:hover {
    background: #4752c4;
  }
  .hidden {
    display: none !important;
  }
  .msg .sender {
    font-weight: bold;
    margin-right: 6px;
  }
</style>
</head>
<body>

<div class="name-screen" id="nameScreen">
  <h2>Enter a name to chat</h2>
  <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
  <button id="nameBtn">Continue</button>
</div>

<div class="chat-box hidden" id="chatBox">
  <div class="chat-header">💬 Chat</div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <button class="attach-btn" id="attachBtn" title="Attach a file">+</button>
    <input type="file" id="fileInput" class="hidden" accept="image/*,video/*,audio/*,.pdf,.txt,.zip,.doc,.docx">
    <input type="text" id="msgInput" placeholder="Type a message..." maxlength="200">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">
  import leoProfanity from 'https://cdn.jsdelivr.net/npm/leo-profanity@1.7.0/+esm';

  leoProfanity.remove(['crap', 'damn', 'hell', 'suck', 'stupid', 'idiot']);
  leoProfanity.add(['yourword1', 'yourword2']); // add your custom list here

  function checkMessage(text) {
    if (leoProfanity.check(text)) {
      return { allowed: false, censored: leoProfanity.clean(text) };
    }
    return { allowed: true, censored: text };
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const nameScreen = document.getElementById('nameScreen');
  const chatBox = document.getElementById('chatBox');
  const nameInput = document.getElementById('nameInput');
  const nameBtn = document.getElementById('nameBtn');

  let username = '';
  let ws = null;

  const MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB, keep WebSocket messages reasonable

  function enterChat() {
    const name = nameInput.value.trim();
    if (!name) return;
    username = checkMessage(name).allowed ? name : 'Guest';
    nameScreen.classList.add('hidden');
    chatBox.classList.remove('hidden');
    inputEl.focus();
    connectWebSocket();
  }

  nameBtn.addEventListener('click', enterChat);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterChat();
  });

  function connectWebSocket() {
    ws = new WebSocket('wss://chatworker.poopoo739738494.workers.dev');

    ws.addEventListener('open', () => {
      addSystemMessage('Connected to chat.');
    });

    ws.addEventListener('message', (event) => {
      const { name, message, attachment } = JSON.parse(event.data);
      addMessage(name, message, attachment);
    });

    ws.addEventListener('close', () => {
      addSystemMessage('Disconnected from chat.');
    });

    ws.addEventListener('error', () => {
      addSystemMessage('Connection error.');
    });
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg blocked';
    div.textContent = text;
    messagesEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function attachmentKind(mimeType) {
    if (mimeType.startsWith('image/')) return 'image';
    if (mimeType.startsWith('video/')) return 'video';
    if (mimeType.startsWith('audio/')) return 'audio';
    return 'file';
  }

  function addMessage(name, text, attachment) {
    const div = document.createElement('div');
    div.className = 'msg';

    if (text) {
      const textLine = document.createElement('div');
      const sender = document.createElement('span');
      sender.className = 'sender';
      sender.textContent = name + ':';
      textLine.appendChild(sender);
      textLine.appendChild(document.createTextNode(text));
      div.appendChild(textLine);
    } else {
      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = name;
      div.appendChild(sender);
    }

    if (attachment) {
      div.appendChild(buildAttachmentEl(attachment));
    }

    messagesEl.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function buildAttachmentEl(attachment) {
    const { kind, dataUrl, filename } = attachment;

    if (kind === 'image') {
      const img = document.createElement('img');
      img.className = 'attachment';
      img.src = dataUrl;
      img.alt = filename || 'image';
      return img;
    }

    if (kind === 'video') {
      const video = document.createElement('video');
      video.className = 'attachment';
      video.src = dataUrl;
      video.controls = true;
      return video;
    }

    if (kind === 'audio') {
      const audio = document.createElement('audio');
      audio.className = 'attachment';
      audio.src = dataUrl;
      audio.controls = true;
      return audio;
    }

    // generic file
    const wrap = document.createElement('div');
    wrap.className = 'file-attachment';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'file-name';
    nameSpan.textContent = filename || 'file';
    wrap.appendChild(nameSpan);

    const downloadLink = document.createElement('a');
    downloadLink.className = 'download-btn';
    downloadLink.href = dataUrl;
    downloadLink.download = filename || 'download';
    downloadLink.textContent = 'Download';
    wrap.appendChild(downloadLink);

    return wrap;
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ name: username, message: text }));
    inputEl.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    fileInput.value = ''; // reset so picking the same file again still fires 'change'
    if (!file) return;

    if (file.size > MAX_FILE_BYTES) {
      addSystemMessage(`"${file.name}" is too large to send (max 5MB).`);
      return;
    }

    if (!ws || ws.readyState !== WebSocket.OPEN) {
      addSystemMessage('Not connected - cannot send file.');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const attachment = {
        kind: attachmentKind(file.type),
        dataUrl: reader.result,
        filename: file.name
      };
      const caption = inputEl.value.trim();
      ws.send(JSON.stringify({ name: username, message: caption, attachment }));
      inputEl.value = '';
    };
    reader.onerror = () => {
      addSystemMessage(`Could not read "${file.name}".`);
    };
    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
