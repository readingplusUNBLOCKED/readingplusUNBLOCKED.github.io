<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Chat</title>
<style>
  html, body {
    height: 100%;
  }
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e2e;
    color: #eee;
    margin: 0;
  }
  .chat-box {
    width: 100%;
    height: 100vh;
    background: #2a2a3d;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #3a3a55;
    padding: 12px 16px;
    font-weight: bold;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    background: #40405c;
    padding: 6px 10px;
    border-radius: 8px;
    max-width: 80%;
    word-wrap: break-word;
    font-size: 14px;
  }
  .msg.blocked {
    background: #5c2e2e;
    color: #ffb3b3;
  }
  .chat-input {
    display: flex;
    border-top: 1px solid #3a3a55;
  }
  .chat-input input {
    flex: 1;
    border: none;
    padding: 10px;
    background: #1e1e2e;
    color: #eee;
    outline: none;
  }
  .chat-input button {
    border: none;
    background: #5865f2;
    color: white;
    padding: 0 16px;
    cursor: pointer;
  }
  .chat-input button:hover {
    background: #4752c4;
  }
  .name-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .name-screen h2 {
    margin: 0;
  }
  .name-screen input {
    padding: 10px 14px;
    border-radius: 6px;
    border: none;
    background: #2a2a3d;
    color: #eee;
    font-size: 16px;
    outline: none;
    width: 220px;
  }
  .name-screen button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #5865f2;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  .name-screen button:hover {
    background: #4752c4;
  }
  .hidden {
    display: none !important;
  }
  .msg .sender {
    font-weight: bold;
    margin-right: 6px;
  }
</style>
</head>
<body>

<div class="name-screen" id="nameScreen">
  <h2>Enter a name to chat</h2>
  <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
  <button id="nameBtn">Continue</button>
</div>

<div class="chat-box hidden" id="chatBox">
  <div class="chat-header">💬 Chat</div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="Type a message..." maxlength="200">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">
  import leoProfanity from 'https://cdn.jsdelivr.net/npm/leo-profanity@1.7.0/+esm';

  leoProfanity.remove(['crap', 'damn', 'hell', 'suck', 'stupid', 'idiot']);
  leoProfanity.add(['yourword1', 'yourword2']); // add your custom list here

  function checkMessage(text) {
    if (leoProfanity.check(text)) {
      return { allowed: false, censored: leoProfanity.clean(text) };
    }
    return { allowed: true, censored: text };
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const nameScreen = document.getElementById('nameScreen');
  const chatBox = document.getElementById('chatBox');
  const nameInput = document.getElementById('nameInput');
  const nameBtn = document.getElementById('nameBtn');

  let username = '';
  let ws = null;

  function enterChat() {
    const name = nameInput.value.trim();
    if (!name) return;
    username = checkMessage(name).allowed ? name : 'Guest';
    nameScreen.classList.add('hidden');
    chatBox.classList.remove('hidden');
    inputEl.focus();
    connectWebSocket();
  }

  nameBtn.addEventListener('click', enterChat);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterChat();
  });

  function connectWebSocket() {
    ws = new WebSocket('wss://chatworker.poopoo739738494.workers.dev');

    ws.addEventListener('open', () => {
      addSystemMessage('Connected to chat.');
    });

    ws.addEventListener('message', (event) => {
      const { name, message } = JSON.parse(event.data);
      addMessage(name, message);
    });

    ws.addEventListener('close', () => {
      addSystemMessage('Disconnected from chat.');
    });

    ws.addEventListener('error', () => {
      addSystemMessage('Connection error.');
    });
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg blocked';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(name, text) {
    const div = document.createElement('div');
    div.className = 'msg';
    const sender = document.createElement('span');
    sender.className = 'sender';
    sender.textContent = name + ':';
    div.appendChild(sender);
    div.appendChild(document.createTextNode(text));
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ name: username, message: text }));
    inputEl.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
