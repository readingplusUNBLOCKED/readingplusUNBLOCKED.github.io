<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReadingPlus</title>
  <style>
    body { background-color: #ADD8E6; font-family: Arial, sans-serif; margin: 0; padding-top: 50px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 120px; }
    .header-container { width: fit-content; margin: 0 auto; background-color: #4682B4; padding: 15px 30px; border-radius: 20px; color: white; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
    .links-container { margin-top: 30px; flex-grow: 1; }
    .links-container a { color: #191970; text-decoration: none; margin: 5px 0; font-size: 1.1em; display: block; }
    .links-container a:hover { text-decoration: underline; }
    .footer-container { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; }
    .input-group { display: flex; gap: 5px; }
    input { flex-grow: 1; padding: 8px; border-radius: 10px; border: none; }
    button { padding: 8px 15px; border-radius: 10px; border: none; cursor: pointer; background: #ADD8E6; }
  </style>
</head>
<body>
  <div class="header-container"><h1>Cool Games</h1></div>
  
  <div class="links-container">
    <a href="https://readingplusunblocked.github.io/sm64">Super Mario 64</a>
    <a href="https://readingplusunblocked.github.io/solitaire">Spider Solitaire</a>
    <a href="https://readingplusunblocked.github.io/smp">Stickman Parkour</a>
    <a href="https://readingplusunblocked.github.io/ffr">Fast Food Rush</a>
    <a href="https://readingplusunblocked.github.io/sfb">Stack Fire Ball</a>
    <a href="https://readingplusunblocked.github.io/nab">Nuts and Bolts</a>
    <a href="https://readingplusunblocked.github.io/bb">Block Blast</a>
    <a href="https://readingplusunblocked.github.io/bh">Basket Hoop</a>
    <a href="https://readingplusunblocked.github.io/tl">Troll Level</a>
    <a href="https://readingplusunblocked.github.io/whg">World's Hardest Game</a>
    <a href="https://readingplusunblocked.github.io/ld">Level Devil</a>
    <a href="https://readingplusunblocked.github.io/idft3d">Idle Dino Farm Tycoon 3D</a>
  </div>

  <div class="footer-container">
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Enter URL here" />
      <button onclick="goURL()">GOTO</button>
    </div>
    <div class="input-group">
      <input type="text" id="ytInput" placeholder="YouTube Search" />
      <button onclick="">under construction!</button>
    </div>
  </div>

  <script>
    function goURL() {
      let url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;
      const finalUrl = url + (url.includes('?') ? '&' : '?') + 'zz=readingplus';
      window.open(finalUrl, '_blank');
    }
    function goYT() {
      let q = document.getElementById('ytInput').value.trim();
      if (q) window.location.href = '/yt?q=' + encodeURIComponent(q);
    }
  </script>
</body>
</html>
